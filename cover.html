<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞鸟集 · 序</title><link rel="stylesheet" href="assets/cover.css?v=3"></head><body>
<canvas id="sky" aria-label="随鼠标飞行的粒子鸟群"></canvas><div class="grain" aria-hidden="true"></div>
<header><span>FIELD NOTES / 飞鸟集</span><button id="settingsButton" aria-expanded="false" aria-controls="settings">调整粒子 ＋</button></header>
<main><div class="eyebrow">A FIELD GUIDE TO MOVEMENT</div><h1>飞鸟集</h1><div class="english">STRAY BIRDS</div><p>形态隐去，习性浮现。</p><a class="enter" href="index.html?catalog=1&amp;open=directory">翻 阅 <span>↗</span></a></main>
<footer><span>移动鼠标 · 与鸟群同行</span><button id="pause">暂停运动</button><span>序 / 00</span></footer>
<aside id="settings" hidden><h2>鸟群的形态</h2><label>粒子大小 <output id="sizeOut"></output><input id="size" type="range" min="1" max="12" step="0.5"></label><label>跟随鸟群数量 <output id="countOut"></output><input id="count" type="range" min="12" max="180" step="1"></label><label>飞行速度 <output id="speedOut"></output><input id="speed" type="range" min="0.3" max="2" step="0.1"></label><label class="check"><input id="passing" type="checkbox"> 背景鸟群掠过</label><label>背景鸟群间隔 <output id="intervalOut"></output><input id="interval" type="range" min="5" max="30" step="1"></label><div class="buttons"><button id="saveSettings">保存设置</button><button id="reset">恢复默认</button></div><p id="status" role="status">仅调整封面，不改变目录排版。</p></aside>
<script src="assets/flock.js?v=3"></script><script src="assets/cover.js?v=3"></script></body></html>
