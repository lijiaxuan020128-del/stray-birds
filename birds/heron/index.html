<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>苍鹭 · 飞鸟集</title>
  <script src="p5.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <main class="species-page">
    <header class="species-head">
      <div>
        <div class="eyebrow">FIELD NOTES · 涉禽</div>
        <h1>苍鹭 <span>Grey Heron</span></h1>
      </div>
      <a class="back-link" href="../../">返回目录</a>
    </header>

    <section class="species-info">
      <div class="identity-card">
        <div class="bird-art-wrap"><img id="heronArt" alt="苍鹭插画" /></div>
        <div class="translation">
          <div class="real-bird-label">苍鹭</div>
          <div class="translation-line"><span></span></div>
          <div class="particle-sample" aria-label="网页中苍鹭粒子示意"></div>
          <div class="particle-copy"><strong>一个粒子 = 一只苍鹭</strong><small>ONE PARTICLE · ONE BIRD</small></div>
        </div>
      </div>

      <article class="info-block">
        <div class="info-index">01 / BEHAVIOR</div>
        <h2>行为</h2>
        <p>苍鹭常以较疏离的方式在水边活动。它们缓慢移动、停留观察，也会改变方向或短距离飞往另一处水域。画面以少量粒子的移动、停顿、转向与飞入飞出，对应这种从容而彼此保持距离的活动状态。</p>
      </article>

      <article class="info-block">
        <div class="info-index">02 / HABITAT</div>
        <h2>环境</h2>
        <p>主要活动于湖泊、河流、湿地、浅水岸边等开阔水域。这里保留远山、草地与浅水组成的环境，让粒子的运动依附于真实栖息空间，而不是脱离环境的装饰动画。</p>
      </article>
    </section>

    <section class="effect-section">
      <div class="effect-label">03 / OBSERVATION</div>
      <h2 class="effect-title">效果展示</h2>
      <section class="observation-frame" aria-label="苍鹭动态观察窗口">
        <div id="sketchMount"></div>
      </section>
    </section>
  </main>

  <script src="sketch.js"></script>
  <script>
    (function mountHeronCanvas(){
      const mount = document.getElementById('sketchMount');
      const move = () => {
        const canvas = document.querySelector('canvas.p5Canvas');
        if (canvas && canvas.parentElement !== mount) mount.appendChild(canvas);
      };
      new MutationObserver(move).observe(document.body, {childList:true, subtree:true});
      move();
    })();

    // 目录中的鸟图是 Base64 内嵌数据。直接读取完整目录 HTML，定位“苍鹭”附近的图片数据。
    (async function loadHeronArtwork(){
      const target = document.getElementById('heronArt');
      try {
        const response = await fetch('../../index.html', { cache: 'no-store' });
        const html = await response.text();

        // 1. 优先尝试目录当前 DOM 中直接存在的苍鹭项目。
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const direct = doc.querySelector('[aria-label="苍鹭"] img, [aria-label*="苍鹭"] img');
        if (direct && direct.getAttribute('src')) {
          target.src = direct.getAttribute('src');
          return;
        }

        // 2. 保存后的目录可能把各页鸟类存在脚本/JSON中。以“苍鹭”为中心寻找最近的 PNG data URL。
        const nameIndex = html.indexOf('苍鹭');
        if (nameIndex !== -1) {
          const before = html.slice(Math.max(0, nameIndex - 2500000), nameIndex);
          const after = html.slice(nameIndex, Math.min(html.length, nameIndex + 2500000));
          const dataPattern = /data:image\/png;base64,[A-Za-z0-9+/=]+/g;
          const beforeMatches = before.match(dataPattern) || [];
          const afterMatch = after.match(dataPattern);
          const nearestBefore = beforeMatches.length ? beforeMatches[beforeMatches.length - 1] : null;
          const nearestAfter = afterMatch && afterMatch.length ? afterMatch[0] : null;

          // 在目录结构中图片通常紧邻鸟名；优先使用同一项目中位于鸟名后的图片，否则取前一张。
          if (nearestAfter) {
            const distanceAfter = after.indexOf(nearestAfter);
            if (distanceAfter < 1200000) {
              target.src = nearestAfter;
              return;
            }
          }
          if (nearestBefore) {
            target.src = nearestBefore;
            return;
          }
        }

        // 3. 最后遍历所有目录项目，用 aria-label/text 锁定苍鹭。
        for (const item of doc.querySelectorAll('.item')) {
          const label = (item.getAttribute('aria-label') || '') + ' ' + item.textContent;
          if (/苍鹭|Grey Heron/i.test(label)) {
            const img = item.querySelector('img');
            if (img && img.getAttribute('src')) {
              target.src = img.getAttribute('src');
              return;
            }
          }
        }
      } catch (error) {
        console.error('苍鹭插画读取失败：', error);
      }
    })();
  </script>
</body>
</html>
