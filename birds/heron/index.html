<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>苍鹭 · 飞鸟集</title>
  <script src="p5.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <main class="species-page">
    <header class="species-head">
      <div>
        <div class="eyebrow">FIELD NOTES · 涉禽</div>
        <h1>苍鹭 <span>Grey Heron</span></h1>
      </div>
      <a class="back-link" href="../../">返回目录</a>
    </header>

    <section class="species-info">
      <div class="identity-card">
        <div class="bird-art-wrap"><img id="heronArt" alt="苍鹭插画" /></div>
        <div class="translation">
          <div class="real-bird-label">苍鹭</div>
          <div class="translation-line"><span></span></div>
          <div class="particle-sample" aria-label="网页中苍鹭粒子示意"></div>
          <div class="particle-copy"><strong>一个粒子 = 一只苍鹭</strong><small>ONE PARTICLE · ONE BIRD</small></div>
        </div>
      </div>

      <article class="info-block">
        <div class="info-index">01 / BEHAVIOR</div>
        <h2>行为</h2>
        <p>苍鹭常以较疏离的方式在水边活动。它们缓慢移动、停留观察，也会改变方向或短距离飞往另一处水域。画面以少量粒子的移动、停顿、转向与飞入飞出，对应这种从容而彼此保持距离的活动状态。</p>
      </article>

      <article class="info-block">
        <div class="info-index">02 / HABITAT</div>
        <h2>环境</h2>
        <p>主要活动于湖泊、河流、湿地、浅水岸边等开阔水域。这里保留远山、草地与浅水组成的环境，让粒子的运动依附于真实栖息空间，而不是脱离环境的装饰动画。</p>
      </article>
    </section>

    <section class="effect-section">
      <div class="effect-label">03 / OBSERVATION</div>
      <h2 class="effect-title">效果展示</h2>
      <section class="observation-frame" aria-label="苍鹭动态观察窗口">
        <div id="sketchMount"></div>
      </section>
    </section>
  </main>

  <script src="sketch.js"></script>
  <script>
    (function mountHeronCanvas(){
      const mount = document.getElementById('sketchMount');
      const move = () => {
        const canvas = document.querySelector('canvas.p5Canvas');
        if (canvas && canvas.parentElement !== mount) mount.appendChild(canvas);
      };
      new MutationObserver(move).observe(document.body, {childList:true, subtree:true});
      move();
    })();

    // 从目录页面寻找苍鹭贴图。兼容目录项不是 aria-label 的情况。
    fetch('../../index.html')
      .then(r => r.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const candidates = Array.from(doc.querySelectorAll('img'));
        const source = candidates.find(img => {
          const text = [img.alt, img.title, img.getAttribute('aria-label'), img.src]
            .filter(Boolean).join(' ');
          const parentText = img.parentElement ? img.parentElement.textContent : '';
          return /苍鹭|heron/i.test(text + ' ' + parentText);
        });
        if (source) {
          const raw = source.getAttribute('src');
          document.getElementById('heronArt').src = new URL(raw, new URL('../../', location.href)).href;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
