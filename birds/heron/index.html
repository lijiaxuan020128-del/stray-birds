<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>苍鹭 · 飞鸟集</title>
  <script src="p5.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <main class="species-page">
    <header class="species-head">
      <div>
        <div class="eyebrow">FIELD NOTES · 涉禽</div>
        <h1>苍鹭 <span>Grey Heron</span></h1>
      </div>
      <a class="back-link" href="../../">返回目录</a>
    </header>

    <section class="species-info">
      <div class="identity-card">
        <div class="mapping-row">
          <div class="bird-art-wrap"><img id="heronArt" alt="苍鹭插画" /></div>
          <div class="translation-line" aria-hidden="true"><span></span></div>
          <div class="particle-sample" aria-label="网页中苍鹭粒子示意"></div>
        </div>
        <div class="particle-copy"><strong>一个粒子 = 一只苍鹭</strong><small>ONE PARTICLE · ONE BIRD</small></div>
      </div>

      <article class="info-block">
        <div class="info-index">01 / BEHAVIOR</div>
        <h2>行为</h2>
        <p>苍鹭常以较疏离的方式在水边活动。它们缓慢移动、停留观察，也会改变方向或短距离飞往另一处水域。画面以少量粒子的移动、停顿、转向与飞入飞出，对应这种从容而彼此保持距离的活动状态。</p>
      </article>

      <article class="info-block">
        <div class="info-index">02 / HABITAT</div>
        <h2>环境</h2>
        <p>主要活动于湖泊、河流、湿地、浅水岸边等开阔水域。这里保留远山、草地与浅水组成的环境，让粒子的运动依附于真实栖息空间，而不是脱离环境的装饰动画。</p>
      </article>
    </section>

    <section class="effect-section">
      <div class="effect-label">03 / OBSERVATION</div>
      <h2 class="effect-title">效果展示</h2>
      <section class="observation-frame" aria-label="苍鹭动态观察窗口">
        <div id="sketchMount"></div>
      </section>
    </section>
  </main>

  <script src="sketch.js"></script>
  <script>
    (function mountHeronCanvas(){
      const mount = document.getElementById('sketchMount');
      const move = () => {
        const canvas = document.querySelector('canvas.p5Canvas');
        if (canvas && canvas.parentElement !== mount) mount.appendChild(canvas);
      };
      new MutationObserver(move).observe(document.body, {childList:true, subtree:true});
      move();
    })();

    (function loadHeronArtwork(){
      const target = document.getElementById('heronArt');
      try {
        if (window.parent && window.parent !== window) {
          const parentDoc = window.parent.document;
          const parentHeron = parentDoc.querySelector('.item[aria-label="苍鹭"] img, .item[aria-label*="苍鹭"] img');
          if (parentHeron && parentHeron.src) {
            target.src = parentHeron.src;
            return;
          }
        }
      } catch (error) {
        console.warn('无法直接读取父目录中的苍鹭插画，改用目录扫描：', error);
      }

      const frame = document.createElement('iframe');
      frame.src = '../../?heron-art-source=1';
      frame.setAttribute('aria-hidden', 'true');
      frame.tabIndex = -1;
      frame.style.cssText = 'position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;opacity:0;pointer-events:none;border:0;';
      document.body.appendChild(frame);

      const finish = (src) => {
        if (src) target.src = src;
        setTimeout(() => frame.remove(), 50);
      };

      frame.addEventListener('load', () => {
        let tries = 0;
        const scan = () => {
          tries++;
          try {
            const doc = frame.contentDocument;
            if (!doc) throw new Error('目录文档不可访问');
            const heron = doc.querySelector('.item[aria-label="苍鹭"] img, .item[aria-label*="苍鹭"] img');
            if (heron && heron.src) {
              finish(heron.src);
              return;
            }
            const pageButtons = Array.from(doc.querySelectorAll('#pages button'));
            if (pageButtons.length) pageButtons[(tries - 1) % pageButtons.length].click();
            if (tries < 12) setTimeout(scan, 180);
            else finish('');
          } catch (error) {
            console.error('苍鹭插画读取失败：', error);
            finish('');
          }
        };
        setTimeout(scan, 350);
      }, { once:true });
    })();
  </script>
</body>
</html>
