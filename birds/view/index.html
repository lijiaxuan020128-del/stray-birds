<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞鸟集 · 鸟类观察</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:rgb(39,37,46);color:rgb(244,239,220);font-family:Georgia,"Songti SC",SimSun,serif}.species-page{width:min(1320px,calc(100vw - 96px));margin:auto;padding:40px 0 58px}.species-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-bottom:1px solid rgba(244,239,220,.22);padding-bottom:20px}.eyebrow{font:10px Arial,sans-serif;letter-spacing:3.2px;opacity:.5;margin-bottom:10px}h1{margin:0;font-size:31px;font-weight:normal;letter-spacing:5px}h1 span{margin-left:16px;font-size:13px;letter-spacing:2px;opacity:.52}.page-actions button{border:1px solid rgba(244,239,220,.34);padding:9px 14px;background:rgba(244,239,220,.06);color:inherit;font:11px Arial,sans-serif;letter-spacing:1.4px;cursor:pointer}.species-info{display:grid;grid-template-columns:350px minmax(270px,.82fr) minmax(270px,.82fr);gap:46px;padding:34px 0 40px}.identity-card{width:350px;min-height:260px;padding-right:34px;border-right:1px solid rgba(244,239,220,.16);display:flex;align-items:center;justify-content:center}.mapping-row{display:grid;grid-template-columns:150px 48px 72px;column-gap:10px;width:290px;align-items:start}.mapping-unit{height:245px;display:grid;grid-template-rows:190px 24px 16px;row-gap:5px;align-items:center;justify-items:center}.mapping-visual{height:190px;width:100%;display:flex;align-items:center;justify-content:center}.bird-art-wrap{width:150px;height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}.bird-art-wrap canvas{display:block;width:auto!important;height:auto!important;max-width:132px!important;max-height:170px!important}.translation-line{width:48px}.translation-line span{display:block;width:100%;height:1px;background:rgba(244,239,220,.34);position:relative}.translation-line span:after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid rgba(244,239,220,.58);border-top:3px solid transparent;border-bottom:3px solid transparent}.particle-sample{width:15px;height:15px;border-radius:50%;background:#838b95;border:1px solid #e5ebf1}.mapping-cn,.mapping-en{font-family:Arial,"Microsoft Yahei",sans-serif;text-align:center;white-space:nowrap}.mapping-cn{font-size:13px;letter-spacing:1.2px;line-height:24px}.mapping-unit:nth-child(2) .mapping-cn{font-size:9px;opacity:.48}.mapping-en{font-size:6.5px;opacity:.34;line-height:16px}.info-block{padding-top:10px}.info-block+.info-block{border-left:1px solid rgba(244,239,220,.16);padding-left:46px}.info-index,.effect-label{font:9px Arial,sans-serif;letter-spacing:2px;opacity:.4;margin-bottom:12px}.info-block h2,.effect-title{font-size:16px;font-weight:normal;letter-spacing:4px;margin:0}.info-block p{margin:0;font-size:12px;line-height:2;letter-spacing:.55px;opacity:.68}.effect-section{padding-top:28px;border-top:1px solid rgba(244,239,220,.18)}.effect-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.effect-fullscreen{border:0;border-bottom:1px solid rgba(244,239,220,.28);padding:5px 0;background:transparent;color:inherit;font:10px Arial,sans-serif;letter-spacing:1.5px;opacity:.52;cursor:pointer}.observation-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#17171b;box-shadow:0 18px 48px rgba(0,0,0,.2)}.observation-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#17171b}@media(max-width:900px){.species-page{width:calc(100vw - 32px);padding-top:24px}.species-info{grid-template-columns:1fr;gap:26px}.identity-card{width:100%;min-height:0;border-right:0;border-bottom:1px solid rgba(244,239,220,.14);padding:0 0 26px}.info-block+.info-block{border-left:0;border-top:1px solid rgba(244,239,220,.14);padding-left:0;padding-top:26px}}
</style>
</head><body><main class="species-page"><header class="species-head"><div><div class="eyebrow" id="category"></div><h1><span id="cn" style="margin-left:0;font-size:31px;letter-spacing:5px;opacity:1"></span><span id="en"></span></h1></div><nav class="page-actions"><button id="back">← 返回目录</button></nav></header><section class="species-info"><div class="identity-card"><div class="mapping-row"><div class="mapping-unit"><div class="mapping-visual"><div class="bird-art-wrap"><canvas id="birdArt"></canvas></div></div><div class="mapping-cn" id="oneBird"></div><div class="mapping-en" id="oneBirdEn"></div></div><div class="mapping-unit"><div class="mapping-visual"><div class="translation-line"><span></span></div></div><div class="mapping-cn">抽象成</div><div class="mapping-en">ABSTRACTED AS</div></div><div class="mapping-unit"><div class="mapping-visual"><div class="particle-sample"></div></div><div class="mapping-cn">一个粒子</div><div class="mapping-en">ONE PARTICLE</div></div></div></div><article class="info-block"><div class="info-index">01 / BEHAVIOR</div><h2>行为</h2><p id="behavior"></p></article><article class="info-block"><div class="info-index">02 / HABITAT</div><h2>环境</h2><p id="habitat"></p></article></section><section class="effect-section"><div class="effect-heading"><div><div class="effect-label">03 / OBSERVATION</div><h2 class="effect-title">效果展示</h2></div><button id="full" class="effect-fullscreen">全屏观看 ↗</button></div><section class="observation-frame"><iframe id="effect" allow="fullscreen"></iframe></section></section></main>
<script>
const D={
'麻雀':['Eurasian Tree Sparrow','鸣禽','常在地面成小群活动，以啄食、短距离跳跃和突然飞起为主。画面中的粒子会在地面分散觅食，也会有少量个体飞入、飞离。','常见于城市道路、广场、居民区和农田附近，尤其喜欢有人类活动、容易获得食物的开阔地面。','../sparrow/'],
'普通翠鸟':['Common Kingfisher','攀禽','常沿水边停栖观察，发现猎物后快速俯冲入水。粒子的停顿、快速位移与回到栖点，对应这种鲜明的捕食节奏。','主要依赖河流、湖泊、池塘等清洁水域及其岸边枝条、石块等停栖点。','../kingfisher/'],
'普通雨燕':['Common Swift','鸣禽','绝大多数活动都在空中完成，飞行迅速而连续。粒子以持续高速移动、转向和群体穿越画面表现其空中生活。','常见于城市上空、山地和开阔区域的高空，繁殖时会利用建筑缝隙或岩壁。','../swift/'],
'太平鸟':['Bohemian Waxwing','鸣禽','常结群停栖和取食，群体会在树冠之间同步起飞又重新聚集。粒子的聚散与短距离群飞对应这种集群行为。','多活动于有浆果植物的林缘、城市绿地和疏林环境。','../waxwing/'],
'小䴙䴘':['Little Grebe','游禽','在水面游动时会突然潜入水下，并从另一处重新出现。粒子的游动、下潜消失和异处浮出对应其典型潜水行为。','主要生活在池塘、湖泊、缓流河段和有水生植物覆盖的湿地。','../little-grebe/'],
'针尾沙锥':['Pin-tailed Snipe','涉禽','常在湿地低处隐蔽活动，受惊后会突然快速飞起并离开。画面表现其地面分散活动以及从两侧飞入、飞离。','偏好泥泞浅水、湿草地、稻田和沼泽边缘等低矮湿地。','../pin-tailed-snipe/'],
'震旦鸦雀':['Reed Parrotbill','鸣禽','常在芦苇丛中小群移动，在茎秆之间穿梭、停留并重新聚集。粒子的局部聚散对应其依附芦苇活动的特点。','高度依赖大片芦苇湿地，活动范围通常集中在连续的芦苇植被内部。','../reed-parrotbill/'],
'珠颈斑鸠':['Spotted Dove','陆禽','常在地面觅食和休息；受到猛禽干扰时会迅速四散飞离，危险解除后再逐渐返回。','常见于城市绿地、屋顶平台、庭院和农田等与人类环境相邻的开阔区域。','../spotted-dove-kestrel/'],
'红隼':['Common Kestrel','猛禽','以快速闯入和追击形成明显的捕食压力。画面中红隼粒子速度更快，并驱散原本聚集活动的斑鸠。','可利用城市建筑、开阔农田和草地等环境观察并追捕猎物。','../spotted-dove-kestrel/'],
'白鹡鸰':['White Wagtail','鸣禽','常在地面快速行走、奔跑并频繁改变方向，也会进行短距离飞行。粒子的轻快移动对应其活跃的地面活动。','常见于水边、道路、广场和其他开阔地面，尤其偏好靠近水体的区域。','../white-wagtail/'],
'斑头雁':['Bar-headed Goose','游禽','迁飞时形成有秩序但会不断微调的群体队形，个体彼此保持距离并共同前进。','繁殖和停歇于高原湖泊、湿地及周边草地，迁徙时会进行长距离高空飞行。','../bar-headed-goose/'],
'大斑啄木鸟':['Great Spotted Woodpecker','攀禽','主要依附树干攀爬、停顿和啄击，活动位置沿垂直树干不断变化。','主要生活在森林、公园及具有成熟乔木的城市绿地。','../great-spotted-woodpecker/'],
'戴胜':['Eurasian Hoopoe','陆禽','常在地面缓慢行走并用长嘴探查土壤寻找食物，受扰后会飞往附近重新落地。','偏好开阔草地、农田、林缘以及具有裸露地面的疏林环境。','../hoopoe/'],
'黑水鸡':['Common Moorhen','游禽','在水面和岸边持续游动，个体靠近时会调整方向、彼此避让。粒子的游动和局部驱离表现这种水域活动。','常生活在池塘、河道和城市水域，尤其偏好岸边具有芦苇等植被遮蔽的环境。','../moorhen/'],
'鸿雁':['Swan Goose','游禽','既会在水面分散游动，也会成群起飞、形成动态队形并再次降落。群体并非机械同步，而会持续微调位置。','主要依赖湖泊、河流、湿地及周边开阔草地，在迁徙过程中跨越较大区域。','../swan-goose/'],
'家燕':['Barn Swallow','鸣禽','常成群在低空快速飞行捕食昆虫，飞行路线连续而灵活，个体会不断穿入和离开群体。','常见于乡村、城市边缘、农田和水域附近的开阔低空，也会利用建筑结构停栖和筑巢。','../barn-swallow/']};
const q=new URLSearchParams(location.search),name=q.get('bird')||'麻雀',d=D[name]||D['麻雀'];document.title=name+' · 飞鸟集';cn.textContent=name;en.textContent=d[0];category.textContent='FIELD NOTES · '+d[1];oneBird.textContent='一只'+name;oneBirdEn.textContent='ONE '+d[0].toUpperCase();behavior.textContent=d[2];habitat.textContent=d[3];effect.src=d[4]+'?embedded=1&v=20261026-species';
back.onclick=()=>{if(parent!==window)parent.postMessage({type:'stray-birds-close'},location.origin);else location.href='../../'};full.onclick=()=>{if(parent!==window)parent.postMessage({type:'stray-birds-fullscreen'},location.origin);else document.documentElement.requestFullscreen?.()};
function crop(src){const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const p=x.getImageData(0,0,c.width,c.height).data;let a=c.width,b=c.height,r=-1,t=-1;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++)if(p[(y*c.width+xx)*4+3]>8){a=Math.min(a,xx);b=Math.min(b,y);r=Math.max(r,xx);t=Math.max(t,y)}if(r<a)return;birdArt.width=r-a+1;birdArt.height=t-b+1;birdArt.getContext('2d').drawImage(c,a,b,r-a+1,t-b+1,0,0,r-a+1,t-b+1)}catch(e){}};img.src=src}
try{if(parent!==window){const im=parent.document.querySelector(`.item[aria-label="${name}"] img,.item[aria-label*="${name}"] img`);if(im?.src)crop(im.src)}}catch(e){}
if(!birdArt.width){const f=document.createElement('iframe');f.src='../../';f.style.cssText='position:fixed;width:1px;height:1px;left:-10000px;opacity:0';document.body.appendChild(f);f.onload=()=>{let n=0;const scan=()=>{n++;try{const doc=f.contentDocument,im=doc?.querySelector(`.item[aria-label="${name}"] img,.item[aria-label*="${name}"] img`);if(im?.src){crop(im.src);f.remove();return}const bs=doc?Array.from(doc.querySelectorAll('#pages button')):[];if(bs.length)bs[(n-1)%bs.length].click();if(n<14)setTimeout(scan,180);else f.remove()}catch(e){f.remove()}};setTimeout(scan,300)}}
</script></body></html>
