<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:rgb(39,37,46);color:rgb(244,239,220);font-family:Georgia,"Songti SC",SimSun,serif}.species-page{width:min(1320px,calc(100vw - 96px));margin:auto;padding:40px 0 58px}.species-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-bottom:1px solid rgba(244,239,220,.22);padding-bottom:20px}.eyebrow{font:10px Arial,sans-serif;letter-spacing:3.2px;opacity:.5;margin-bottom:10px}h1{margin:0;font-size:31px;font-weight:normal;letter-spacing:5px}h1 span{margin-left:16px;font-size:13px;letter-spacing:2px;opacity:.52}.page-actions button{border:1px solid rgba(244,239,220,.34);padding:9px 14px;background:rgba(244,239,220,.06);color:inherit;font:11px Arial,sans-serif;letter-spacing:1.4px;cursor:pointer}.species-info{display:grid;grid-template-columns:350px minmax(270px,.82fr) minmax(270px,.82fr);gap:46px;padding:34px 0 40px;align-items:stretch}.identity-card{width:350px;min-height:300px;padding-right:34px;border-right:1px solid rgba(244,239,220,.16);display:flex;align-items:center;justify-content:center}.mapping-row{display:grid;grid-template-columns:150px 48px 72px;column-gap:10px;width:290px;align-items:start}.mapping-unit{height:245px;display:grid;grid-template-rows:190px 24px 16px;row-gap:5px;align-items:center;justify-items:center}.mapping-visual{height:190px;width:100%;display:flex;align-items:center;justify-content:center}.bird-art-wrap{width:150px;height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}.bird-art-wrap canvas{display:block;width:auto!important;height:auto!important;max-width:132px!important;max-height:170px!important}.translation-line{width:48px}.translation-line span{display:block;width:100%;height:1px;background:rgba(244,239,220,.34);position:relative}.translation-line span:after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid rgba(244,239,220,.58);border-top:3px solid transparent;border-bottom:3px solid transparent}.particle-sample{border-radius:50%;flex:0 0 auto}.mapping-cn,.mapping-en{font-family:Arial,"Microsoft Yahei",sans-serif;text-align:center;white-space:nowrap}.mapping-cn{font-size:13px;letter-spacing:1.2px;line-height:24px}.mapping-unit:nth-child(2) .mapping-cn{font-size:9px;opacity:.48}.mapping-en{font-size:6.5px;opacity:.34;line-height:16px}.info-block{min-height:300px;padding:22px 0;display:flex;flex-direction:column;justify-content:center}.info-block+.info-block{border-left:1px solid rgba(244,239,220,.16);padding-left:46px}.info-index,.effect-label{font:9px Arial,sans-serif;letter-spacing:2px;opacity:.4;margin-bottom:12px}.info-block h2,.effect-title{font-size:16px;font-weight:normal;letter-spacing:4px;margin:0}.info-block p{margin:14px 0 0;font-size:12px;line-height:2.05;letter-spacing:.55px;opacity:.68;max-width:43em}.effect-section{padding-top:28px;border-top:1px solid rgba(244,239,220,.18)}.effect-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.effect-fullscreen{border:0;border-bottom:1px solid rgba(244,239,220,.28);padding:5px 0;background:transparent;color:inherit;font:10px Arial,sans-serif;letter-spacing:1.5px;opacity:.52;cursor:pointer}.observation-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#17171b;box-shadow:0 18px 48px rgba(0,0,0,.2)}.observation-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#17171b}@media(max-width:900px){.species-page{width:calc(100vw - 32px);padding-top:24px}.species-info{grid-template-columns:1fr;gap:26px}.identity-card{width:100%;min-height:0;border-right:0;border-bottom:1px solid rgba(244,239,220,.14);padding:0 0 26px}.info-block{min-height:0;padding:8px 0}.info-block+.info-block{border-left:0;border-top:1px solid rgba(244,239,220,.14);padding-left:0;padding-top:26px}}
</style>
</head><body><main class="species-page"><header class="species-head"><div><div class="eyebrow" id="category"></div><h1><span id="cn" style="margin-left:0;font-size:31px;letter-spacing:5px;opacity:1"></span><span id="en"></span></h1></div><nav class="page-actions"><button id="back">← 返回目录</button></nav></header><section class="species-info"><div class="identity-card"><div class="mapping-row"><div class="mapping-unit"><div class="mapping-visual"><div class="bird-art-wrap"><canvas id="birdArt"></canvas></div></div><div class="mapping-cn" id="oneBird"></div><div class="mapping-en" id="oneBirdEn"></div></div><div class="mapping-unit"><div class="mapping-visual"><div class="translation-line"><span></span></div></div><div class="mapping-cn">抽象成</div><div class="mapping-en">ABSTRACTED AS</div></div><div class="mapping-unit"><div class="mapping-visual"><div class="particle-sample" id="particleSample"></div></div><div class="mapping-cn">一个粒子</div><div class="mapping-en">ONE PARTICLE</div></div></div></div><article class="info-block"><div class="info-index">01 / BEHAVIOR</div><h2>行为</h2><p id="behavior"></p></article><article class="info-block"><div class="info-index">02 / HABITAT</div><h2>环境</h2><p id="habitat"></p></article></section><section class="effect-section"><div class="effect-heading"><div><div class="effect-label">03 / OBSERVATION</div><h2 class="effect-title">效果展示</h2></div><button id="full" class="effect-fullscreen">全屏观看 ↗</button></div><section class="observation-frame"><iframe id="effect" allow="fullscreen"></iframe></section></section></main>
<script>
const D={
'麻雀':{en:'Eurasian Tree Sparrow',cat:'鸣禽',behavior:'麻雀具有很强的群居性，常成小群落到地面觅食，以连续跳跃代替缓慢步行，并在停顿间快速啄取谷粒、草籽和散落食物。个体之间距离较近，却并不保持整齐队形；受到惊扰时会突然成批飞起，危险解除后又陆续返回。画面中的短跳、啄食、少量飞入飞出以及点击后的整体惊飞，正是对这种活跃而警觉的地面生活节奏的抽象。',habitat:'与人类聚居环境关系密切，常见于村落、城市街道、公园、校园、农田和建筑周边。它们偏好既有开阔地面便于觅食、又有树木或建筑缝隙可供停栖和繁殖的环境，因此石砖、道路和庭院等人工地表也是典型活动空间。页面保留近距离城市地面，让粒子的跳跃与飞离发生在真实的日常栖息尺度中。',url:'../sparrow/',p:{size:22,fill:'#9D4B3D',stroke:'#e5c7a4',sw:1.2}},
'普通翠鸟':{en:'Common Kingfisher',cat:'攀禽',behavior:'普通翠鸟常独自停在临水的枝条、石块或其他突出物上，长时间保持安静并观察水面。一旦发现小鱼等猎物，会突然从栖点高速俯冲入水，捕获后迅速出水并返回附近停栖处。它的行为节奏具有非常明显的“静止观察—突然俯冲—出水回栖”变化，因此画面用停顿、快速位移、入水水花与扩散波纹来强调这种瞬间爆发的捕食方式。',habitat:'主要依赖河流、溪流、湖泊、池塘和湿地等水域，尤其需要能够提供小型鱼类等猎物、并具有岸边枝条或石块作为观察点的环境。繁殖时还需要适合掘洞的土质岸壁。页面选择有清晰水面与岸边栖点的环境，使粒子的俯冲路径、入水位置和水面波纹都与翠鸟真实的临水活动方式建立联系。',url:'../kingfisher/',p:{size:9,fill:'#38c9cc',stroke:'#99dbc2',sw:1}},
'普通雨燕':{en:'Common Swift',cat:'鸣禽',behavior:'普通雨燕是高度适应空中生活的鸟类，除繁殖停巢外，大量时间都在飞行中度过，并能在空中捕食、饮水和进行社会活动。它们常以快速振翅和滑翔连续穿越开阔天空，群体成员不断改变相对位置，有时形成高速聚集、追逐和盘旋。页面因此让大量小粒子持续高速运动、频繁穿越画面中央，而不是停留在固定位置，以突出其几乎不落地的空中生活。',habitat:'觅食空间主要是城市、村镇、湖泊、河谷和山地上空等开阔空域，昆虫丰富的暖湿天气尤其适合群体活动。繁殖时常利用建筑物屋檐、墙缝、塔楼以及天然岩壁的孔隙。页面把天空作为主要运动场，让粒子可以从边缘进入并穿越整个画面，弱化地面边界，更接近雨燕真实的三维空中活动空间。',url:'../swift/',p:{size:9,fill:'#26353D',stroke:'#B8C4C7',sw:.55}},
'太平鸟':{en:'Bohemian Waxwing',cat:'鸣禽',behavior:'太平鸟在非繁殖期具有鲜明的群居性，会组成紧密而喧闹的鸟群四处寻找浆果。找到结果丰富的树木后，群体会集中停栖、取食，又可能突然一起飞往下一处食源；个体也会在细枝上移动甚至悬挂取果。页面以较密集的粒子停留、局部换位、数只同时飞起以及群体重新聚集，表现这种围绕食物不断聚散的社会性活动。',habitat:'繁殖期多见于北方较开阔的针叶林或针阔混交林，并常靠近湖泊、池塘和溪流；非繁殖期则会随果实资源广泛游荡到林缘、道路两侧、城市公园和居民绿地。冬季浆果树是重要的聚集中心。页面采用积雪与果实枝条构成的环境，使粒子的停栖和群体换位围绕明确的食物资源发生。',url:'../waxwing/',p:{size:30,fill:'#A58D73',stroke:'#fbbb32',sw:1}},
'小䴙䴘':{en:'Little Grebe',cat:'游禽',behavior:'小䴙䴘体型虽小，却是灵活的潜水者。它们常贴近水面游动，在发现水生昆虫、小鱼或其他猎物后突然扎入水下，潜游一段距离，再从与下潜点不同的位置浮出。受到干扰时也更倾向潜水躲避，而不是立即起飞。页面把这种节奏转化为水面游动、快速下潜、短暂消失和异处重新出现，并配合涟漪与水下轨迹表现其隐蔽的水下移动。',habitat:'繁殖期常选择池塘、小型湖泊、缓流河段以及城市公园水体，尤其偏好岸边具有芦苇、香蒲等挺水植物的区域，浓密植被既能遮蔽巢位，也便于受到惊扰时迅速隐蔽。冬季还会利用较大的河流、溪流和部分半咸水环境。页面中的荷叶和水生植物共同限定了它贴近植被活动的水域空间。',url:'../little-grebe/',p:{size:20,fill:'#795548',stroke:'#5f1707',sw:1}},
'针尾沙锥':{en:'Pin-tailed Snipe',cat:'涉禽',behavior:'针尾沙锥多在湿软地面低调活动，凭借保护色隐藏在草丛和泥地间，行走时不断用长嘴探入泥中寻找无脊椎动物。它们往往直到危险接近才突然起飞，以快速而直接的飞行离开原地，随后在另一处湿地重新降落。页面用缓慢行走、停顿探食、短距离移动与突然从左右两侧飞入飞离的对比，表现这种“隐蔽觅食—骤然惊飞”的行为反差。',habitat:'迁徙和越冬期间常见于淡水沼泽、湿草地、稻田、泥泞水塘边缘和季节性积水地，通常偏好植被不太高、土壤柔软且有浅水的区域。这样的环境既提供可探取的底栖食物，也提供草丛遮蔽。页面保留金棕色湿地与开阔通道，让粒子的低位活动和横向飞离都依附于真实湿地结构。',url:'../pin-tailed-snipe/',p:{size:25,fill:'#796044',stroke:'#E1CAA1',sw:1.1}},
'震旦鸦雀':{en:'Reed Parrotbill',cat:'鸣禽',behavior:'震旦鸦雀对芦苇具有很强的依赖，常成小群在苇秆和苇穗之间活动。它们会沿茎秆攀移、短跳，在相邻植株间进行短距离飞行，并不断停下取食昆虫或芦苇种子。群体不会形成整齐队形，而是随着芦苇结构局部聚集和分散。页面让粒子停栖在不同苇秆上、短跳换位并偶尔飞入飞出，以表现这种贴着植被内部移动的生活方式。',habitat:'典型栖息地是大片、连续而成熟的芦苇湿地，包括湖泊、河口、河岸和沿海滩涂附近的苇荡。相比一般林鸟，它们很少长时间离开芦苇系统，因此栖息地的连续性尤其重要。页面不把粒子铺满整个画面，而是让运动集中在芦苇植株及其间隙，使环境本身成为行为路径的一部分。',url:'../reed-parrotbill/',p:{size:35,fill:'#f3bc44',stroke:'#9a5b28',sw:1.2}},
'珠颈斑鸠':{en:'Spotted Dove',cat:'陆禽',behavior:'珠颈斑鸠通常成对或组成小群，在地面缓慢行走并啄取草籽、谷粒等食物，也会在树枝、屋顶和平台上休息。它们并非紧密集群，个体之间保持松散距离；受到突然惊扰时会以有力而明显的振翅迅速起飞。当前场景加入红隼闯入后，斑鸠会立即四散离开，待威胁消失后再陆续返回，从而突出其平静觅食与受惊逃逸之间的变化。',habitat:'适应人工环境的能力很强，常见于城市住宅区、公园、庭院、校园、农田、村落以及河岸疏林。它们偏好同时具有裸露或低矮地面用于觅食、以及树木或建筑结构用于停栖的环境。页面使用城市平台作为活动地面，使斑鸠的觅食、停留和突然起飞发生在它们现实中经常利用的人造空间。',url:'../spotted-dove-kestrel/',p:{size:21,fill:'#A58D8C',stroke:'#514945',sw:1.5}},
'红隼':{en:'Common Kestrel',cat:'猛禽',behavior:'红隼以小型哺乳动物、昆虫和小鸟等为食，常从高处观察地面，也以迎风悬停的方式搜寻猎物；锁定目标后会迅速俯冲或低空追击。与斑鸠相比，它的移动更突然、速度更高，并会直接改变周围鸟类的行为。当前场景把红隼作为一次短暂的捕食压力：高速闯入、落地停留数秒，再快速追出画面，使斑鸠群产生明显的惊飞和回落过程。',habitat:'偏好具有开阔视野的草地、农田、荒地、城市边缘和道路周边，同时需要树木、电线杆、建筑或岩壁作为观察与繁殖地点。它能够较好适应城市，只要周围仍有足够开阔的捕食空间。页面中的屋顶平台与开阔背景共同提供了这种“高处观察—快速进入开阔地”的空间关系。',url:'../spotted-dove-kestrel/',p:{size:28,fill:'#B87652',stroke:'#332724',sw:1.8}},
'白鹡鸰':{en:'White Wagtail',cat:'鸣禽',behavior:'白鹡鸰是典型的地面觅食鸟，常一边快速行走或短跑，一边频繁上下摆动长尾。发现活动的昆虫时会突然加速追赶，也会跳起或进行很短的捕虫飞行；落地后摆尾动作往往更加明显。非繁殖期还会组成小群，夜间甚至形成大型集体栖息。页面用石面上的快速行走、停顿觅食、方向变化和偶尔跨越石块的短飞来对应这种轻快、连续的地面运动。',habitat:'广泛利用各种开阔或半开阔环境，包括河岸、湖岸、海岸、草地、农田、道路、广场、公园和居民区，也常在人造建筑附近繁殖。水边尤其常见，因为浅水和潮湿地面能提供丰富昆虫。页面选择岩石溪流环境，并让粒子主要依附石面和水边活动，强调它在陆地与水缘之间频繁移动的特征。',url:'../white-wagtail/',p:{size:18,fill:'#E4E6E3',stroke:'#303331',sw:1.5}},
'斑头雁':{en:'Bar-headed Goose',cat:'游禽',behavior:'斑头雁具有著名的长距离迁徙能力，迁飞时会组成群体，并通过不断调整相对位置维持有利于飞行的队形。真实鸟群并不是固定不变的几何图形：领飞个体、间距和队列会随着气流和个体速度持续微调。页面因此设置明确的整体迁飞方向，同时让每个粒子拥有独立速度、下降幅度和轻微漂移，使队形保持可辨识的秩序，却不会像整块图形一样机械平移。',habitat:'繁殖期主要活动于中亚和青藏高原等地区的高海拔湖泊、河谷湿地及周边草甸，常在水边休息并到附近草地取食。迁徙期间会跨越极高山地，并利用沿途湖泊、河流和湿地作为停歇地。页面以开阔高空和远景地貌为主，让粒子的长距离斜向穿越突出迁徙，而不是局限在局部水面活动。',url:'../bar-headed-goose/',p:{size:27,fill:'#D5D2C8',stroke:'#343536',sw:2.2}},
'大斑啄木鸟':{en:'Great Spotted Woodpecker',cat:'攀禽',behavior:'大斑啄木鸟大部分时间依附树干和粗枝活动，以强壮的脚和尾羽支撑身体，沿树皮向上攀爬并不断停顿搜索。它会啄开树皮寻找昆虫，也会通过敲击和鼓声进行交流与宣示领域；换树时则进行短距离起伏飞行。页面让粒子在不同景深的树干上攀移、停顿和换树飞行，并利用前后遮挡关系强化它始终围绕垂直树体活动的特点。',habitat:'主要生活在落叶林、针阔混交林、成熟林缘，也能利用城市公园、校园和具有大树的居民绿地。关键条件不是完全封闭的森林，而是存在足够数量的成熟树木，为觅食、敲击和凿洞筑巢提供树干。页面用三层树干构成主要空间，让粒子的活动范围直接由树木位置而不是整个画布决定。',url:'../great-spotted-woodpecker/',p:{size:35,fill:'#B8322A',stroke:'#52231F',sw:4}},
'戴胜':{en:'Eurasian Hoopoe',cat:'陆禽',behavior:'戴胜常单独或疏散地在地面觅食，边走边用细长而略弯的嘴探入松软土壤，寻找昆虫幼虫、甲虫和其他无脊椎动物。它会在一小片区域停留反复探食，随后步行或快速跑向另一处；受到干扰时则低飞一段距离重新落地。页面用停留、缓慢行走、局部觅食、偶尔快速跑动和低飞换位表现这种以地面搜索为核心的行为节奏。',habitat:'偏好温暖、开阔且地表植被较低的环境，例如草地、农田、果园、林缘、疏林、牧场和村落周边。觅食需要裸露或较松软的地面，而繁殖又依赖树洞、墙洞或岩石缝隙，因此常出现在开阔地与零散树木、建筑相结合的景观。页面保留大面积可行走地面，让粒子的搜索路径具有明确的陆地基础。',url:'../hoopoe/',p:{size:28,fill:'#D98232',stroke:'#5A351D',sw:1.4}},
'黑水鸡':{en:'Common Moorhen',cat:'游禽',behavior:'黑水鸡既善于游泳，也经常离开水面到草岸觅食。游动时身体前后轻微摆动，遇到其他个体会调整方向并保持距离；繁殖期具有领域性，近距离相遇时可能出现追逐和驱赶。它们也会钻入岸边浓密植被中隐藏或休息。页面把持续游动、相互避让、偶发追逐、进入芦苇以及自然游出画面组合起来，表现水面活动并非单纯匀速漂移。',habitat:'典型栖息地包括淡水沼泽、湖泊、池塘、缓流河道和城市公园水体，通常偏好岸边具有芦苇、香蒲等挺水植物以及草质浅岸的区域。植被为筑巢和躲避提供遮蔽，开阔水面与岸边又提供多样食物。页面中的城市雾河同时保留水面和芦苇边界，使粒子能够在开放水域与隐蔽岸缘之间转换。',url:'../moorhen/',p:{size:18,fill:'#541c2d',stroke:'#282424',sw:1}},
'鸿雁':{en:'Swan Goose',cat:'游禽',behavior:'鸿雁具有明显的群体性，在停歇水域会成群游动、取食和警戒，迁徙时则共同起飞并形成不断变化的飞行队列。水面上的个体不会完全同步转向，而是各自调整速度和间距；起飞后群体逐渐组织起来，降落时又重新分散到水面。页面让粒子经历游动、转向、起飞、群飞、飞出、第二批进入和再次降落的完整循环，以呈现群体状态在水面与天空之间的转换。',habitat:'繁殖和迁徙高度依赖大型湖泊、河流、沼泽、河漫滩及其周边草地，常在开阔水面休息，在岸边湿草地和浅水区域取食。迁徙过程中需要连续的湿地停歇点。页面把粒子主要分布在画面下方水域，并保留上方天空作为起飞后的运动空间，使同一场景同时容纳游泳和群飞两种典型行为。',url:'../swan-goose/',p:{size:24,fill:'#89674F',stroke:'#cab69b',sw:1.8}},
'家燕':{en:'Barn Swallow',cat:'鸣禽',behavior:'家燕是典型的空中捕虫鸟，常在农田、水面和居民区上空进行快速、灵活而连续的低空飞行，通过急转弯捕捉飞虫。群体也会集中停在电线等细长结构上休息，随后一只或数只陆续起飞，再重新落到其他位置。页面把“停在线上—沿线移动—起飞—空中穿行—换线降落—少量飞入飞出”串成循环，使静态停栖与高速飞行形成清晰对比。',habitat:'常见于村镇、农田、牧场、城市边缘以及河流、池塘等水域附近的开阔环境，这些地方既有丰富的飞行昆虫，也有人造建筑可供筑巢。电线、屋檐和建筑边缘是常见停栖点。页面以电线作为明确的静态依托，同时保留足够开阔的天空，让粒子可以在“线上的群体”与“空中的个体”之间自然切换。',url:'../barn-swallow/',p:{size:16,fill:'#263E47',stroke:'#e45b21',sw:2}}
};
const q=new URLSearchParams(location.search),name=q.get('bird')||'麻雀',d=D[name]||D['麻雀'];document.title=name+' · 飞鸟集';cn.textContent=name;en.textContent=d.en;category.textContent='FIELD NOTES · '+d.cat;oneBird.textContent='一只'+name;oneBirdEn.textContent='ONE '+d.en.toUpperCase();behavior.textContent=d.behavior;habitat.textContent=d.habitat;effect.src=d.url+'?embedded=1&v=20261026-species2';
const ps=document.getElementById('particleSample'),scale=Math.min(1.35,Math.max(.75,22/d.p.size));ps.style.width=(d.p.size*scale)+'px';ps.style.height=(d.p.size*scale)+'px';ps.style.background=d.p.fill;ps.style.border=d.p.sw+'px solid '+d.p.stroke;ps.style.boxShadow='0 0 0 .5px rgba(255,255,255,.08)';
back.onclick=()=>{if(parent!==window)parent.postMessage({type:'stray-birds-close'},location.origin);else location.href='../../'};full.onclick=()=>{if(parent!==window)parent.postMessage({type:'stray-birds-fullscreen'},location.origin);else document.documentElement.requestFullscreen?.()};
function crop(src){const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const data=x.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++)if(data[(y*c.width+xx)*4+3]>8){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}if(maxX<0)return;const w=maxX-minX+1,h=maxY-minY+1,b=document.getElementById('birdArt');b.width=w;b.height=h;b.getContext('2d').drawImage(c,minX,minY,w,h,0,0,w,h)}catch(e){console.warn(e)}};img.src=src}
try{if(parent!==window){const p=parent.document.querySelector('.item[aria-label="'+name+'"] img,.item[aria-label*="'+name+'"] img');if(p&&p.src)crop(p.src)}}catch(e){}
if(!birdArt.width){const f=document.createElement('iframe');f.src='../../?bird-art='+encodeURIComponent(name);f.style.cssText='position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;opacity:0;border:0';document.body.appendChild(f);f.onload=()=>{let n=0;const scan=()=>{n++;try{const doc=f.contentDocument,p=doc&&doc.querySelector('.item[aria-label="'+name+'"] img,.item[aria-label*="'+name+'"] img');if(p&&p.src){crop(p.src);f.remove();return}const bs=doc?Array.from(doc.querySelectorAll('#pages button')):[];if(bs.length)bs[(n-1)%bs.length].click();if(n<16)setTimeout(scan,160);else f.remove()}catch(e){f.remove()}};setTimeout(scan,300)}}
</script></body></html>
